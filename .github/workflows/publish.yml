name: publish

# A `v*` tag is a release. Nothing is public until every gate passed on the three systems and every
# archive started; `cargo publish` is the last step, because nobody can take a crate back.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A second run for the same tag waits for the first, so two runs never race on one release.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag goes on a commit whose ci and corpus runs on main passed, so this job checks those runs
  # instead of repeating them. Tag a commit only after both are green.
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: ci and corpus passed on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in ci.yml corpus.yml; do
            passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main \
              --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
            if [ "$passed" -eq 0 ]; then
              echo "::error::$workflow has no passed run on main for $GITHUB_SHA; tag a commit after it is green"
              exit 1
            fi
          done

  draft:
    name: Draft the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create it once, so the builds below only attach to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
                 --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md for what changed."

  # The archives `cargo binstall chock` looks for (see [package.metadata.binstall]).
  binaries:
    name: ${{ matrix.target }}
    needs: draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl links statically, so one Linux binary runs on any distribution's glibc.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          cache: false

      - name: Install the musl linker
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd "target/${{ matrix.target }}/release"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$GITHUB_WORKSPACE/chock-${{ matrix.target }}.zip" chock.exe
          else
            tar czf "$GITHUB_WORKSPACE/chock-${{ matrix.target }}.tgz" chock
          fi

      # The archive is what a user gets, so the binary starts from it, and it must name the tag.
      - name: Start the packaged binary
        run: |
          mkdir "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP/unpacked"
          if [ "$RUNNER_OS" = Windows ]; then
            7z x "$GITHUB_WORKSPACE/chock-${{ matrix.target }}.zip"
          else
            tar xzf "$GITHUB_WORKSPACE/chock-${{ matrix.target }}.tgz"
          fi
          said="$(./chock --version)"
          echo "$said"
          test "$said" = "chock ${GITHUB_REF_NAME#v}"

      # A draft takes the new archive. A public release keeps the archive it has, so a second run
      # never changes what users already downloaded.
      - name: Attach to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for archive in chock-${{ matrix.target }}.*; do
            held=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,assets \
              --jq "(.isDraft | not) and any(.assets[]; .name == \"$archive\")")
            if [ "$held" = true ]; then
              echo "$archive is already on the public release $GITHUB_REF_NAME; it stays as it is"
              continue
            fi
            gh release upload "$GITHUB_REF_NAME" "$archive" --repo "$GITHUB_REPOSITORY" --clobber
          done

  publish:
    name: crates.io
    needs: [gates, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Trusted publishing hands the job a short-lived token instead of a stored secret.
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      - name: What the published crate would contain
        run: cargo package --locked --list

      # Before the crate, so `cargo binstall chock` finds the archives from the first minute.
      - name: Show the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

      # A second run of this job finds the version already there, and has nothing left to do.
      - name: Is this version on crates.io already?
        id: published
        run: |
          code=$(curl -s --retry 3 -o /dev/null -w '%{http_code}' -A "$AGENT" "$CRATE_URL/${GITHUB_REF_NAME#v}")
          echo "exists=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          AGENT: chock-publish (github.com/outpostHQ/chock)
          CRATE_URL: https://crates.io/api/v1/crates/chock

      - name: Ask crates.io for a token
        if: steps.published.outputs.exists != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      # A publish that fails because the version arrived since the check above has nothing to do.
      - name: cargo publish
        if: steps.published.outputs.exists != 'true'
        run: |
          if cargo publish --locked; then
            exit 0
          fi
          code=$(curl -s --retry 3 -o /dev/null -w '%{http_code}' -A "$AGENT" "$CRATE_URL/${GITHUB_REF_NAME#v}")
          if [ "$code" = 200 ]; then
            echo "::notice::chock ${GITHUB_REF_NAME#v} is on crates.io already"
            exit 0
          fi
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          AGENT: chock-publish (github.com/outpostHQ/chock)
          CRATE_URL: https://crates.io/api/v1/crates/chock
